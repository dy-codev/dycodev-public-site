<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Hardware Komputer - Kelas X SMK</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 25px;
            text-align: center;
        }

        h1 {
            font-size: 1.4rem;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .image-container {
            width: 100%;
            height: 200px;
            background-color: #2c3e50;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            padding: 20px;
        }

        .image-container svg {
            max-width: 100%;
            max-height: 100%;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.3));
        }

        .question {
            font-size: 1.05rem;
            font-weight: 600;
            color: #34495e;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .btn-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-grid-img {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .btn {
            background-color: #ffffff;
            border: 2px solid #3498db;
            color: #3498db;
            padding: 12px 15px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:hover:not([disabled]) {
            background-color: #3498db;
            color: #ffffff;
        }

        .btn-img-option {
            background-color: #ffffff;
            border: 2px solid #3498db;
            border-radius: 8px;
            padding: 10px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-img-option svg {
            max-width: 100%;
            max-height: 100%;
            pointer-events: none;
        }

        .btn-img-option:hover:not([disabled]) {
            background-color: #ebf5fb;
            border-color: #2980b9;
        }

        .btn.correct, .btn-img-option.correct {
            background-color: #2ecc71 !important;
            border-color: #2ecc71 !important;
            color: #ffffff !important;
        }

        .btn.wrong, .btn-img-option.wrong {
            background-color: #e74c3c !important;
            border-color: #e74c3c !important;
            color: #ffffff !important;
        }

        .btn:disabled, .btn-img-option:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }

        .footer-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #7f8c8d;
        }

        .next-btn, .restart-btn {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .next-btn:hover, .restart-btn:hover {
            background-color: #1a252f;
        }

        .hide {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <h1>Kuis Hardware Komputer</h1>
        <p class="subtitle">Sistem Komputer Kelas X SMK</p>

        <div id="quiz-box">
            <div class="image-container" id="svg-container">
                <!-- SVG ditaruh di sini melalui JavaScript -->
            </div>

            <div class="question" id="question-text">Perangkat apakah pada gambar di atas?</div>

            <div class="btn-grid" id="answer-buttons">
                <!-- Tombol jawaban diproduksi melalui JavaScript -->
            </div>

            <div class="footer-info">
                <span id="progress">Soal 1 dari 10</span>
                <button id="next-btn" class="next-btn hide" onclick="nextQuestion()">Lanjut</button>
            </div>
        </div>

        <div id="result-box" class="hide">
            <h2>Kuis Selesai!</h2>
            <p id="score-text" style="font-size: 1.2rem; margin: 20px 0;"></p>
            <button class="restart-btn" onclick="startQuiz()">Ulangi Kuis</button>
        </div>
    </div>

    <script>
        // Gambar SVG independen tanpa dependensi link eksternal
        const svgHardware = {
            ram: `<svg viewBox="0 0 200 60" width="250"><rect x="5" y="10" width="190" height="40" rx="3" fill="#27ae60"/><rect x="25" y="20" width="25" height="20" fill="#2c3e50"/><rect x="60" y="20" width="25" height="20" fill="#2c3e50"/><rect x="95" y="20" width="25" height="20" fill="#2c3e50"/><rect x="130" y="20" width="25" height="20" fill="#2c3e50"/><rect x="165" y="20" width="20" height="20" fill="#2c3e50"/><g fill="#f1c40f"><rect x="15" y="52" width="5" height="5"/><rect x="25" y="52" width="5" height="5"/><rect x="35" y="52" width="5" height="5"/><rect x="45" y="52" width="5" height="5"/><rect x="55" y="52" width="5" height="5"/><rect x="65" y="52" width="5" height="5"/><rect x="75" y="52" width="5" height="5"/><rect x="85" y="52" width="5" height="5"/><rect x="105" y="52" width="5" height="5"/><rect x="115" y="52" width="5" height="5"/><rect x="125" y="52" width="5" height="5"/><rect x="135" y="52" width="5" height="5"/><rect x="145" y="52" width="5" height="5"/><rect x="155" y="52" width="5" height="5"/><rect x="165" y="52" width="5" height="5"/><rect x="175" y="52" width="5" height="5"/></g></svg>`,
            
            cpu: `<svg viewBox="0 0 100 100" width="150"><rect x="10" y="10" width="80" height="80" rx="5" fill="#bdc3c7"/><rect x="25" y="25" width="50" height="50" fill="#7f8c8d"/><text x="50" y="55" font-family="Arial" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CPU</text><circle cx="20" cy="20" r="3" fill="#f1c40f"/></svg>`,
            
            hdd: `<svg viewBox="0 0 120 160" width="130"><rect x="10" y="10" width="100" height="140" rx="6" fill="#95a5a6"/><rect x="15" y="15" width="90" height="130" rx="4" fill="#34495e"/><circle cx="60" cy="65" r="35" fill="#bdc3c7"/><circle cx="60" cy="65" r="10" fill="#7f8c8d"/><polygon points="60,65 90,110 80,115" fill="#e74c3c"/><rect x="30" y="125" width="60" height="12" fill="#2c3e50"/></svg>`,
            
            motherboard: `<svg viewBox="0 0 150 150" width="170"><rect x="5" y="5" width="140" height="140" fill="#16a085"/><rect x="20" y="20" width="40" height="40" fill="#7f8c8d"/><rect x="75" y="20" width="10" height="60" fill="#2c3e50"/><rect x="90" y="20" width="10" height="60" fill="#2c3e50"/><rect x="20" y="100" width="80" height="12" fill="#ecf0f1"/><rect x="20" y="120" width="80" height="12" fill="#ecf0f1"/><circle cx="115" cy="105" r="10" fill="#bdc3c7"/></svg>`,
            
            psu: `<svg viewBox="0 0 160 120" width="160"><rect x="10" y="10" width="140" height="100" rx="4" fill="#34495e"/><circle cx="55" cy="60" r="35" fill="#2c3e50"/><line x1="55" y1="25" x2="55" y2="95" stroke="#7f8c8d" stroke-width="3"/><line x1="20" y1="60" x2="90" y2="60" stroke="#7f8c8d" stroke-width="3"/><rect x="105" y="25" width="30" height="15" fill="#e74c3c"/><rect x="105" y="65" width="30" height="25" fill="#7f8c8d"/></svg>`
        };

        // Data Soal (Total 10 Soal: 5 tebak gambar, 5 tebak gambar berdasarkan fungsi)
        const questions = [
            // Kategori 1: Tebak Nama dari Gambar
            {
                type: 'identify-image',
                svg: svgHardware.ram,
                question: "Perangkat apakah pada gambar di atas?",
                answers: ["RAM", "ROM", "Harddisk"],
                correct: 0
            },
            {
                type: 'identify-image',
                svg: svgHardware.cpu,
                question: "Perangkat apakah pada gambar di atas?",
                answers: ["Power Supply", "Processor (CPU)", "Motherboard"],
                correct: 1
            },
            {
                type: 'identify-image',
                svg: svgHardware.hdd,
                question: "Perangkat apakah pada gambar di atas?",
                answers: ["SSD", "Flashdisk", "Harddisk (HDD)"],
                correct: 2
            },
            {
                type: 'identify-image',
                svg: svgHardware.motherboard,
                question: "Perangkat apakah pada gambar di atas?",
                answers: ["Motherboard", "VGA Card", "Sound Card"],
                correct: 0
            },
            {
                type: 'identify-image',
                svg: svgHardware.psu,
                question: "Perangkat apakah pada gambar di atas?",
                answers: ["Heatsink", "Power Supply Unit (PSU)", "LAN Card"],
                correct: 1
            },
            // Kategori 2: Tebak Gambar Berdasarkan Fungsi (5 Soal Tambahan Baru)
            {
                type: 'identify-hw-from-function',
                question: "Manakah perangkat keras di bawah ini yang berfungsi sebagai otak pemrosesan data dan instruksi dalam sistem komputer?",
                options: ['cpu', 'ram', 'hdd', 'motherboard'],
                correct: 0
            },
            {
                type: 'identify-hw-from-function',
                question: "Manakah perangkat keras di bawah ini yang berfungsi sebagai media penyimpanan sementara (volatile) saat komputer aktif?",
                options: ['psu', 'ram', 'cpu', 'hdd'],
                correct: 1
            },
            {
                type: 'identify-hw-from-function',
                question: "Manakah gambar perangkat keras yang merupakan papan sirkuit utama tempat seluruh komponen utama komputer terhubung?",
                options: ['hdd', 'motherboard', 'psu', 'ram'],
                correct: 1
            },
            {
                type: 'identify-hw-from-function',
                question: "Manakah perangkat keras yang berfungsi untuk mengubah arus listrik AC ke DC serta menyuplai daya ke seluruh komponen komputer?",
                options: ['cpu', 'motherboard', 'psu', 'hdd'],
                correct: 2
            },
            {
                type: 'identify-hw-from-function',
                question: "Manakah perangkat keras yang berfungsi sebagai media penyimpanan data utama yang bersifat permanen (non-volatile)?",
                options: ['ram', 'cpu', 'hdd', 'psu'],
                correct: 2
            }
        ];

        let activeQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;

        const quizBox = document.getElementById('quiz-box');
        const resultBox = document.getElementById('result-box');
        const svgContainer = document.getElementById('svg-container');
        const questionTextElement = document.getElementById('question-text');
        const answerButtonsElement = document.getElementById('answer-buttons');
        const nextButton = document.getElementById('next-btn');
        const progressElement = document.getElementById('progress');
        const scoreTextElement = document.getElementById('score-text');

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            // Acak urutan soal (baik soal lama maupun baru)
            activeQuestions = [...questions].sort(() => Math.random() - 0.5);
            quizBox.classList.remove('hide');
            resultBox.classList.add('hide');
            showQuestion();
        }

        function showQuestion() {
            resetState();
            let currentQuestion = activeQuestions[currentQuestionIndex];
            
            progressElement.innerText = `Soal ${currentQuestionIndex + 1} dari ${activeQuestions.length}`;
            questionTextElement.innerText = currentQuestion.question;

            if (currentQuestion.type === 'identify-image') {
                svgContainer.classList.remove('hide');
                svgContainer.innerHTML = currentQuestion.svg;
                
                answerButtonsElement.className = 'btn-grid';
                currentQuestion.answers.forEach((answer, index) => {
                    const button = document.createElement('button');
                    button.innerText = answer;
                    button.classList.add('btn');
                    button.addEventListener('click', () => selectAnswer(index));
                    answerButtonsElement.appendChild(button);
                });
            } else if (currentQuestion.type === 'identify-hw-from-function') {
                svgContainer.classList.add('hide');
                
                answerButtonsElement.className = 'btn-grid-img';
                currentQuestion.options.forEach((hwKey, index) => {
                    const button = document.createElement('button');
                    button.classList.add('btn-img-option');
                    button.innerHTML = svgHardware[hwKey];
                    button.addEventListener('click', () => selectAnswer(index));
                    answerButtonsElement.appendChild(button);
                });
            }
        }

        function resetState() {
            nextButton.classList.add('hide');
            while (answerButtonsElement.firstChild) {
                answerButtonsElement.removeChild(answerButtonsElement.firstChild);
            }
        }

        function selectAnswer(selectedIndex) {
            const currentQuestion = activeQuestions[currentQuestionIndex];
            const buttons = answerButtonsElement.querySelectorAll('button');

            buttons.forEach((button, index) => {
                button.disabled = true;
                if (index === currentQuestion.correct) {
                    button.classList.add('correct');
                }
                if (index === selectedIndex && selectedIndex !== currentQuestion.correct) {
                    button.classList.add('wrong');
                }
            });

            if (selectedIndex === currentQuestion.correct) {
                score++;
            }

            nextButton.classList.remove('hide');
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < activeQuestions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            quizBox.classList.add('hide');
            resultBox.classList.remove('hide');
            const totalQ = activeQuestions.length;
            const finalScore = Math.round((score / totalQ) * 100);
            scoreTextElement.innerText = `Skor Anda: ${finalScore} / 100\n(${score} benar dari ${totalQ} soal)`;

            // --- KODE BARU: Kirim nilai ke aplikasi Vue (Parent) ---
            window.parent.postMessage({
                type: 'QUIZ_FINISHED',
                score: finalScore
            }, '*');
            // --------------------------------------------------------
        }

        // Jalankan kuis saat halaman dimuat
        startQuiz();
    </script>
</body>
</html>
